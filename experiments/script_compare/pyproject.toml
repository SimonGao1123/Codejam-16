[project]
name = "script-compare-test"
version = "0.1.0"
description = "Live script tracking test: Vosk transcript vs a pasted script, matched with sentence embeddings"
requires-python = ">=3.12,<3.13"
dependencies = [
    "vosk<0.3.45",
    "sounddevice>=0.5",
    "numpy",
    "fastembed>=0.4",        # all-MiniLM-L6-v2 as ONNX (no PyTorch)
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
