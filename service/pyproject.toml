[project]
name = "presentation-service"
version = "0.1.0"
description = "Local analysis service for the Presentation Helper app: webcam posture/hands/eye level, voice pitch/volume, live transcript + filler words"
requires-python = ">=3.12,<3.13"
dependencies = [
    "websockets>=13",
    "numpy",
    "webrtcvad-wheels>=2.0.14.post1",
    "fastembed>=0.4",        # script comparison: all-MiniLM-L6-v2 as ONNX (no PyTorch)
    "moonshine-voice",
]

[dependency-groups]
bench = [
    "av<17",                 # newer PyAV breaks faster-whisper
    "faster-whisper>=1.1",
    "jiwer>=4.0.0",
    "pyarrow>=26.0.1",
    "scipy",
    "soundfile>=0.14.0",
    "vosk<0.3.45",
    "whisper-normalizer>=1.0.1",
]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
